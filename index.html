<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字変換ツール</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --border: #d1d5db;
            --text: #111827;
            --text-muted: #6b7280;
            --primary: #2563eb;
            --success: #059669;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* 外部フォントを使わず、端末の標準フォントを使用 */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 600px; }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            margin-bottom: 16px;
        }
        textarea:focus { border-color: var(--primary); }
        textarea[readonly] { background: #f9fafb; color: #374151; }

        /* ボタンデザイン */
        .btn-group { display: flex; gap: 8px; margin-bottom: 24px; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-ghost { background: #e5e7eb; color: var(--text); }
        .btn:hover { opacity: 0.85; }

        .copy-section { position: relative; }
        .copy-btn {
            position: absolute;
            top: -32px;
            right: 0;
            background: none;
            border: none;
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* トースト通知（コピー完了時など） */
        #toast {
            position: fixed;
            bottom: 30px;
            background: #1f2937;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: none;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* アイコン用SVG */
        svg { width: 18px; height: 18px; vertical-align: middle; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>文字変換ツール（半角・全角）</h1>

        <label class="label">入力エリア</label>
        <textarea id="inputText" placeholder="ここにテキストを貼り付けてください..."></textarea>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="convertToHalfWidth()">すべて半角</button>
            <button class="btn btn-success" onclick="convertToFullWidth()">すべて全角</button>
            <button class="btn btn-ghost" onclick="clearText()">クリア</button>
        </div>

        <div class="copy-section">
            <label class="label">変換結果</label>
            <button class="copy-btn" onclick="copyResult()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                コピーする
            </button>
            <textarea id="outputText" readonly placeholder="ここに変換後の文字が表示されます"></textarea>
        </div>
    </div>
</div>

<div id="toast">コピーしました！</div>

<script>
    // 半角に変換
    function convertToHalfWidth() {
        const val = document.getElementById('inputText').value;
        const result = val.replace(/[！-～]/g, s => {
            return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
        }).replace(/　/g, ' '); // スペースも半角に
        document.getElementById('outputText').value = result;
    }

    // 全角に変換
    function convertToFullWidth() {
        const val = document.getElementById('inputText').value;
        const result = val.replace(/[!-~]/g, s => {
            return String.fromCharCode(s.charCodeAt(0) + 0xFEE0);
        }).replace(/ /g, '　'); // スペースも全角に
        document.getElementById('outputText').value = result;
    }

    // クリア
    function clearText() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
    }

    // コピー機能
    function copyResult() {
        const out = document.getElementById('outputText');
        if (!out.value) return;

        out.select();
        try {
            document.execCommand('copy');
            showToast();
        } catch (err) {
            alert("コピーに失敗しました");
        }
    }

    // トースト表示
    function showToast() {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 2000);
    }
</script>

</body>
</html>
